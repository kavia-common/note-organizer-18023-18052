<aside class="sidebar">
  <div class="search-row">
    <input class="input" type="search" placeholder="Search notes..." [(ngModel)]="model.query" (ngModelChange)="onSearchChange()" />
    <button class="btn primary" (click)="onCreate()" title="New note">+ New</button>
  </div>

  <div class="section-title">Filters</div>
  <div class="filters">
    <button class="btn" (click)="togglePinnedOnly()">
      <span *ngIf="model.pinnedOnly">★ Pinned only</span>
      <span *ngIf="!model.pinnedOnly">☆ Include all</span>
    </button>
  </div>

  <div class="section-title">Tags</div>
  <div class="filters">
    <input class="input" type="text" placeholder="tag1, tag2" [(ngModel)]="tagsInput" (keyup.enter)="addTagsFromInput()" />
    <button class="btn" (click)="addTagsFromInput()">Add</button>
  </div>
  <div class="filters" *ngIf="model.tags?.length">
    <span class="badge" *ngFor="let t of model.tags">
      #{{ t }}
      <button class="btn" style="padding:0 0.4rem" (click)="removeTag(t)" aria-label="Remove tag">✕</button>
    </span>
  </div>

  <div class="section-title">Sort</div>
  <div class="filters">
    <button class="btn" [class.primary]="model.sortBy==='updatedAt'" (click)="changeSort('updatedAt')">Updated</button>
    <button class="btn" [class.primary]="model.sortBy==='createdAt'" (click)="changeSort('createdAt')">Created</button>
    <button class="btn" [class.primary]="model.sortBy==='title'" (click)="changeSort('title')">Title</button>
    <button class="btn" (click)="toggleSortDir()">{{ model.sortDir === 'asc' ? 'Asc' : 'Desc' }}</button>
  </div>
</aside>
